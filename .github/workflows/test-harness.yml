name: test-harness

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  fast-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Run fast unit tests
        run: |
          pytest -q -m "not integration and not live"

      - name: Validate installed dependencies
        run: python -m pip check

  integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[websocket]
          python -m pip install pytest pytest-asyncio

      - name: Run integration tests
        run: |
          python -c "import pytest, sys; code = pytest.main(['-q', '-m', 'integration and not live']); sys.exit(0 if code == 5 else code)"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/mtp-wheel-test
          /tmp/mtp-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/mtp-wheel-test/bin/python -c "import mtp; assert mtp.__version__ != '0+unknown'; print(mtp.__version__)"
          /tmp/mtp-wheel-test/bin/mtp --version
          /tmp/mtp-wheel-test/bin/python -m pip check

