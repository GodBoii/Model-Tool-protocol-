name: test-harness

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  isolated-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolkit tests
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio python-dotenv
      - name: Prepare trusted test image
        run: docker pull python:3.13-slim
      - name: Verify actual container restrictions
        env:
          MTP_DOCKER_TEST_IMAGE: python:3.13-slim
        run: python -m pytest -q tests/test_isolated_python.py

  fast-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[mcp-modern]
          python -m pip install pytest pytest-asyncio python-dotenv

      - name: Run fast unit tests
        run: |
          pytest -q -m "not integration and not live"

  integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[websocket,providers,mcp-modern]
          python -m pip install pytest pytest-asyncio python-dotenv

      - name: Run integration tests
        run: |
          python -m pytest -q -m "integration and not live"

